spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/library_db}
    username: ${JDBC_DATABASE_USERNAME:postgres}
    password: ${JDBC_DATABASE_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-to-at-least-32-characters}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  fine-per-day: ${FINE_PER_DAY:5}
  reminder-days-before: ${REMINDER_DAYS_BEFORE:2}
  ai:
    provider: ${AI_PROVIDER:mock}
  notification:
    email-provider: ${EMAIL_PROVIDER:log}
    sms-provider: ${SMS_PROVIDER:log}
